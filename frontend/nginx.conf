map $http_cf_connecting_ip $aurelian_client_ip {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}

limit_req_zone $aurelian_client_ip zone=aurelian_api:10m rate=10r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Do not expose framework/API discovery surfaces in the public portfolio demo.
    location = /docs {
        return 404;
    }

    location = /redoc {
        return 404;
    }

    location = /openapi.json {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        limit_req zone=aurelian_api burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600;

        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }
}
