name: security-quality-and-provenance
on: [push, pull_request]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app tool_runner planner_runner tests
      - run: pytest -q
      - name: Bandit SAST
        run: bandit -q -r app tool_runner planner_runner -x tests
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Secret-pattern sanity check
        run: "! grep -RIE '(AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH) PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|demo-only-change-me|demo-audit-signing-key|demo-internal-token)' app tool_runner planner_runner docker-compose.yml docker-compose.production.yml .env.example"
      - name: Executable/test source manifest
        run: find app tool_runner planner_runner tests -type f -print0 | sort -z | xargs -0 sha256sum > EXECUTABLE_AND_TEST_CODE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: verification-manifest
          path: EXECUTABLE_AND_TEST_CODE_SHA256.txt

  compose-validate:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-jwt-secret-32-bytes-minimum-000001
      AUDIT_SIGNING_KEY: ci-audit-secret-32-bytes-minimum-01
      INTERNAL_SERVICE_TOKEN: ci-internal-token-32-bytes-minimum01
      POSTGRES_ADMIN_PASSWORD: ci-admin-password-32-bytes-minimum01
      POSTGRES_APP_PASSWORD: ci-app-password-32-bytes-minimum-0001
      POSTGRES_AUDIT_PASSWORD: ci-audit-db-password-32-bytes-minimum
      REDIS_PASSWORD: ci-redis-password-32-bytes-minimum-0001
      QDRANT_API_KEY: ci-qdrant-api-key-32-bytes-minimum-01
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config >/dev/null

  runtime-security-integration:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-jwt-secret-32-bytes-minimum-000001
      AUDIT_SIGNING_KEY: ci-audit-secret-32-bytes-minimum-01
      INTERNAL_SERVICE_TOKEN: ci-internal-token-32-bytes-minimum01
      POSTGRES_ADMIN_PASSWORD: ci-admin-password-32-bytes-minimum01
      POSTGRES_APP_PASSWORD: ci-app-password-32-bytes-minimum-0001
      POSTGRES_AUDIT_PASSWORD: ci-audit-db-password-32-bytes-minimum
      REDIS_PASSWORD: ci-redis-password-32-bytes-minimum-0001
      QDRANT_API_KEY: ci-qdrant-api-key-32-bytes-minimum-01
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral runtime secrets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .secrets
          chmod 700 .secrets

          python3 - <<'PYSECRETS'
          from pathlib import Path
          import secrets

          names = [
              "jwt_secret",
              "audit_signing_key",
              "internal_service_token",
              "postgres_admin_password",
              "postgres_app_password",
              "postgres_audit_password",
              "redis_password",
              "qdrant_api_key",
          ]

          root = Path(".secrets")

          for name in names:
              p = root / name
              p.write_text(secrets.token_hex(32) + "\n")
              p.chmod(0o444)

          print(f"Created {len(names)} ephemeral CI secret files")
          PYSECRETS

          test "$(find .secrets -maxdepth 1 -type f | wc -l)" -eq 8
          echo "PASS: ephemeral runtime secrets prepared"

      - name: Build and start exact Compose topology
        run: docker compose up -d --build
      - name: Wait for public health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Runtime PostgreSQL / RLS / network / service-auth / OPA checks
        run: bash scripts/verify_v352.sh
      - name: Capture runtime state on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color || true
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
